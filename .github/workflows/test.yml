name: Test

on:
  push:
  pull_request:

jobs:
  xmind-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run XMind builder tests
        run: python -m unittest discover -s plugins/test-case-design/skills/test-case-design/scripts -p "test_*.py"
